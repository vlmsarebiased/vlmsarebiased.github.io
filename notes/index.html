  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var key = null, assets = {};

  async function deriveKey(pw) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }
  async function decrypt(bytes) {
    return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, key, bytes.slice(12)));
  }
  var TYPES = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp", gif: "image/gif", svg: "image/svg+xml" };
  async function loadAsset(img) {
    var name = img.getAttribute("data-asset"), file = assets[name];
    if (!file || img.dataset.loaded) return;
    img.dataset.loaded = "1";
    var r = await fetch("assets/" + file);
    var data = await decrypt(new Uint8Array(await r.arrayBuffer()));
    var ext = name.split(".").pop().toLowerCase();
    img.src = URL.createObjectURL(new Blob([data], { type: TYPES[ext] || "application/octet-stream" }));
  }
  function watchAssets(root) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { io.unobserve(e.target); loadAsset(e.target); } });
    }, { rootMargin: "600px" });
    root.querySelectorAll("img[data-asset]").forEach(function (img) { io.observe(img); });
  }
  async function fetchAsset(name) {
    var r = await fetch("assets/" + assets[name]);
    return decrypt(new Uint8Array(await r.arrayBuffer()));
  }
  async function fetchJSON(name) { return JSON.parse(new TextDecoder().decode(await fetchAsset(name))); }
  window.PrivatePage = { watchAssets: watchAssets, loadAsset: loadAsset, fetchJSON: fetchJSON };

  async function open(pw, remember) {
    key = await deriveKey(pw);
    var payload = JSON.parse(new TextDecoder().decode(await decrypt(b64(PAYLOAD))));
    assets = payload.assets;
    if (remember) { try { sessionStorage.setItem("pp", pw); } catch (e) {} }
    var doc = new DOMParser().parseFromString(payload.html, "text/html");
    document.title = doc.title || document.title;
    doc.head.querySelectorAll("style, link[rel=stylesheet]").forEach(function (n) { document.head.appendChild(n); });
    document.body.innerHTML = doc.body.innerHTML;
    // innerHTML does not run scripts, so re-create them in order
    for (var s of Array.from(document.body.querySelectorAll("script"))) {
      var n = document.createElement("script");
      if (s.src) { n.src = s.src; await new Promise(function (ok) { n.onload = n.onerror = ok; document.body.appendChild(n); }); }
      else { n.textContent = s.textContent; document.body.appendChild(n); }
      s.remove();
    }
    watchAssets(document);
    document.dispatchEvent(new Event("private-page-ready"));
  }

  document.getElementById("gate").addEventListener("submit", async function (e) {
    e.preventDefault();
    var err = document.getElementById("err");
    err.textContent = "Opening...";
    try { await open(document.getElementById("pw").value, true); }
    catch (x) { err.textContent = "Wrong password."; }
  });
  var saved = null;
  try { saved = sessionStorage.getItem("pp"); } catch (e) {}
  if (saved) open(saved, false).catch(function () {});
})();
